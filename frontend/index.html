<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo ELK</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #eef3f7;
        color: #17212b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(120deg, rgba(33, 150, 136, 0.13), transparent 34%),
          linear-gradient(240deg, rgba(232, 89, 67, 0.12), transparent 30%),
          #eef3f7;
      }

      main {
        width: min(920px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 28px;
      }

      h1 {
        margin: 0;
        font-size: clamp(36px, 6vw, 68px);
        line-height: 0.95;
        letter-spacing: 0;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 36px;
        padding: 8px 12px;
        border: 1px solid #c9d6df;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.7);
        font-size: 14px;
        white-space: nowrap;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #b3362d;
      }

      .dot.ok {
        background: #16805c;
      }

      form {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        margin-bottom: 18px;
      }

      input {
        width: 100%;
        min-height: 48px;
        border: 1px solid #b7c7d0;
        border-radius: 8px;
        padding: 0 14px;
        background: #ffffff;
        color: #17212b;
        font: inherit;
      }

      button {
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        padding: 0 16px;
        background: #17212b;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button.secondary {
        width: 40px;
        min-height: 40px;
        padding: 0;
        background: #dfe8ee;
        color: #17212b;
      }

      ul {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      li {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 12px;
        min-height: 58px;
        padding: 10px 12px;
        border: 1px solid #d1dde4;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.82);
      }

      input[type="checkbox"] {
        width: 22px;
        min-height: 22px;
        accent-color: #16805c;
      }

      .title {
        overflow-wrap: anywhere;
      }

      .done .title {
        color: #687986;
        text-decoration: line-through;
      }

      .empty {
        min-height: 120px;
        display: grid;
        place-items: center;
        border: 1px dashed #b7c7d0;
        border-radius: 8px;
        color: #617381;
        background: rgba(255, 255, 255, 0.45);
      }

      @media (max-width: 640px) {
        main {
          width: min(100vw - 24px, 920px);
          padding: 28px 0;
        }

        header,
        form {
          grid-template-columns: 1fr;
          align-items: stretch;
        }

        header {
          display: grid;
        }

        form button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Todo<br />ELK</h1>
        <div class="status"><span class="dot" id="dot"></span><span id="status">checking API</span></div>
      </header>

      <form id="form">
        <input id="title" name="title" autocomplete="off" placeholder="Новая задача" />
        <button type="submit">Добавить</button>
      </form>

      <ul id="todos"></ul>
    </main>

    <script>
      const api = "/api";
      const form = document.querySelector("#form");
      const title = document.querySelector("#title");
      const list = document.querySelector("#todos");
      const statusText = document.querySelector("#status");
      const dot = document.querySelector("#dot");

      async function request(path, options) {
        const response = await fetch(`${api}${path}`, {
          headers: { "Content-Type": "application/json" },
          ...options,
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        if (response.status === 204) {
          return null;
        }

        return response.json();
      }

      async function loadTodos() {
        try {
          const todos = await request("/todos");
          dot.classList.add("ok");
          statusText.textContent = "API online";
          render(todos);
        } catch (error) {
          dot.classList.remove("ok");
          statusText.textContent = "API offline";
          render([]);
        }
      }

      function render(todos) {
        list.innerHTML = "";

        if (todos.length === 0) {
          const empty = document.createElement("li");
          empty.className = "empty";
          empty.textContent = "Задач пока нет";
          list.append(empty);
          return;
        }

        for (const todo of todos) {
          const item = document.createElement("li");
          item.className = todo.completed ? "done" : "";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = todo.completed;
          checkbox.addEventListener("change", async () => {
            await request(`/todos/${todo.id}`, {
              method: "PATCH",
              body: JSON.stringify({ completed: checkbox.checked }),
            });
            await loadTodos();
          });

          const text = document.createElement("span");
          text.className = "title";
          text.textContent = todo.title;

          const remove = document.createElement("button");
          remove.className = "secondary";
          remove.type = "button";
          remove.title = "Удалить";
          remove.textContent = "X";
          remove.addEventListener("click", async () => {
            await request(`/todos/${todo.id}`, { method: "DELETE" });
            await loadTodos();
          });

          item.append(checkbox, text, remove);
          list.append(item);
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const value = title.value.trim();
        if (!value) return;

        await request("/todos", {
          method: "POST",
          body: JSON.stringify({ title: value }),
        });
        title.value = "";
        await loadTodos();
      });

      loadTodos();
    </script>
  </body>
</html>
